[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "makra"
version = "0.1.0"
authors = [
    { name = "Makra Labs", email = "dev@makralabs.org" },
]
description = "Makra SDK for Python - Web scraping and data extraction made simple"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=14.0.0",
    "httpx>=0.27.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["web scraping", "data extraction", "sdk", "api", "makra"]
license = { text = "MIT" }

[project.urls]
Homepage = "https://makralabs.org"
Documentation = "https://docs.makralabs.org"
Repository = "https://github.com/makralabs/makra-python"
Issues = "https://github.com/makralabs/makra-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["makra"]

[tool.hatch.build.targets.sdist]
include = [
    "makra/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]