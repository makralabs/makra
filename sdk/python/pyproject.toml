[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makra"
version = "0.0.4"
description = "Official Python SDK for the Makra API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Makra Labs" }]
dependencies = ["httpx>=0.25,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://makralabs.org"

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<9", "pyright>=1.1,<2", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/makra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: credentialed public API checks skipped on pull requests",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
